services:
  postgres:
    image: postgres:16-alpine
    container_name: sync-engine-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sync_engine
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sync_engine"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
